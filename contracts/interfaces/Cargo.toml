[package]
name = "interfaces"
description = "Cross-contract client traits mirroring the Solidity contracts/interfaces directory."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
crate-type = ["lib"]
