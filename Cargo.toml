[workspace]
resolver = "2"
members = [
  "contracts/*",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/rain-usdr/rain-usdr-soroban"
authors = ["Rain Team"]

[workspace.dependencies]
soroban-sdk = "27"
shared = { path = "contracts/shared" }
interfaces = { path = "contracts/interfaces" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
